<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backtest Karşılaştırma Dashboard</title>
<style>
:root{--bg:#07101d;--p:#101d30;--p2:#132640;--line:#29415f;--ink:#eff6ff;--muted:#91a8c5;--green:#35d68b;--red:#ff6577;--blue:#48b8ff;--gold:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;padding:15px 22px;background:#091526ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}h1{font-size:22px;margin:0 0 10px}.controls{display:flex;gap:10px;flex-wrap:wrap}label{color:var(--muted);display:grid;gap:4px}select{min-width:180px;padding:8px;background:#0d192a;color:var(--ink);border:1px solid var(--line);border-radius:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.column{min-width:0}.period{font-size:18px;padding:8px 3px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.panel{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:12px}.card{padding:12px}.k{color:var(--muted);font-size:11px}.v{font-size:21px;font-weight:750;margin-top:5px}.sub{color:var(--muted);margin-top:4px}.panel{padding:13px;margin-top:10px}.panel h2{font-size:14px;margin:0 0 10px}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button{background:#0b1728;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}.tabs button.on{color:var(--ink);background:#21466d}.chart{height:230px;width:100%}.chart canvas{width:100%;height:100%}.scroll{max-height:380px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--p);color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}.heat{display:grid;grid-template-columns:180px repeat(4,1fr);gap:2px}.hc{padding:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#122038}.hn{color:var(--muted);font-size:10px}.note{padding:0 22px 18px;color:var(--muted)}#tip{position:fixed;display:none;z-index:20;pointer-events:none;background:#07101df2;border:1px solid #496889;border-radius:8px;padding:8px 10px;color:#eff6ff;box-shadow:0 8px 30px #0008;font-size:11px;max-width:280px}@media(max-width:1000px){.split{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><h1>Binance Futures · Metot Analizi</h1><div class="controls"><label>Metot<select id="scenario"></select></label><label>Zaman dilimi<select id="tf"></select></label></div></header><main class="split"><section class="column" id="left"></section><section class="column" id="right"></section></main><div id="tip"></div><div class="note">Kâr ve zarar, kaldıraçsız işlem getirilerinin toplamıdır. Aynı 5 dakikalık mumda iki seviye görülürse stop önce uygulanır. 2026 paneli mevcut son veri tarihine kadardır.</div>
<script>
const $=x=>document.getElementById(x), fmt=x=>(+x*100).toLocaleString('tr-TR',{maximumFractionDigits:2})+'%', n=x=>(+x||0).toLocaleString('tr-TR'), hrs=x=>(+x||0).toLocaleString('tr-TR',{maximumFractionDigits:1})+' sa';let scenarios=[],data,grain={left:'month',right:'month'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTip(e,html,pin=false){let t=$('tip');t.innerHTML=html;t.style.display='block';t.style.left=Math.min(innerWidth-300,e.clientX+14)+'px';t.style.top=Math.min(innerHeight-130,e.clientY+14)+'px';if(pin)t.dataset.pin='1'}
function hideTip(){let t=$('tip');if(t.dataset.pin!=='1')t.style.display='none'}
function bindBars(cv,rows,key,mode,pad,w){let hit=e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,idx=Math.floor((x-pad.l)/(w-pad.l-pad.r)*rows.length);if(idx<0||idx>=rows.length)return hideTip();let z=rows[idx],html=`<b>${esc(z[key])}</b><br>${mode==='count'?'İşlem: '+n(z.trades):'Net kâr: '+fmt(z.profit||0)+'<br>Net zarar: '+fmt(z.loss||0)+'<br>İşlem: '+n(z.trades||0)}`;showTip(e,html)};cv.onmousemove=hit;cv.onmouseleave=hideTip;cv.onclick=e=>{hit(e);$('tip').dataset.pin='1'}}
function bindLines(cv,series,p,w){let hit=e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,nx=Math.max(...series.map(s=>s.values.length)),i=Math.max(0,Math.min(nx-1,Math.round((x-p)/(w-2*p)*(nx-1))));showTip(e,`<b>Nokta ${i+1}</b><br>`+series.map(s=>`${esc(s.name)}: ${fmt(s.values[i]||0)}`).join('<br>'))};cv.onmousemove=hit;cv.onmouseleave=hideTip;cv.onclick=e=>{hit(e);$('tip').dataset.pin='1'}}
function bindScatter(cv,rows,p,w,h,mx,lo,hi){cv.onmousemove=e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null,bd=18;rows.forEach(z=>{let px=p.l+(+z.trades/mx)*(w-p.l-p.r),py=h-p.b-(+z.total_return-lo)/(hi-lo)*(h-p.t-p.b),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=z}});if(!best)return hideTip();showTip(e,`<b>${esc(best.filter_name)}</b><br>Net getiri: ${fmt(best.total_return)}<br>İşlem: ${n(best.trades)}<br>Win rate: ${fmt(best.win_rate)}`)};cv.onmouseleave=hideTip;cv.onclick=e=>{cv.onmousemove(e);$('tip').dataset.pin='1'}}
document.addEventListener('click',e=>{if(e.target.tagName!=='CANVAS'){let t=$('tip');t.dataset.pin='';t.style.display='none'}});
function chart(canvas,rows,labelKey,mode='money'){requestAnimationFrame(()=>{let dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);if(!rows.length){c.fillStyle='#91a8c5';c.fillText('Veri yok',10,20);return}let pad={l:42,r:8,t:12,b:42},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(mode==='count'?1:0.000000001,...rows.flatMap(x=>[Math.abs(+x.profit||0),Math.abs(+x.loss||0),+x.trades||0]));let bw=Math.max(2,cw/rows.length*.7),zero=mode==='count'?h-pad.b:h-pad.t+ch/2;c.strokeStyle='#29415f';c.beginPath();c.moveTo(pad.l,zero);c.lineTo(w-pad.r,zero);c.stroke();rows.forEach((x,i)=>{let cx=pad.l+(i+.5)*cw/rows.length;if(mode==='count'){let bh=(+x.trades||0)/max*ch;c.fillStyle='#48b8ff';c.fillRect(cx-bw/2,zero-bh,bw,bh)}else{let ph=Math.abs(+x.profit||0)/max*ch/2,lh=Math.abs(+x.loss||0)/max*ch/2;c.fillStyle='#35d68b';c.fillRect(cx-bw/2,zero-ph,bw,bh=ph);c.fillStyle='#ff6577';c.fillRect(cx-bw/2,zero,bw,lh)}if(rows.length<=20||i%Math.ceil(rows.length/12)===0){c.save();c.translate(cx,h-5);c.rotate(-.55);c.fillStyle='#91a8c5';c.font='9px sans-serif';c.fillText(String(x[labelKey]).slice(0,13),0,0);c.restore()}});c.fillStyle='#35d68b';c.fillRect(pad.l,2,8,8);c.fillStyle='#91a8c5';c.font='10px sans-serif';c.fillText(mode==='count'?'İşlem':'Kâr',pad.l+12,10);if(mode!=='count'){c.fillStyle='#ff6577';c.fillRect(pad.l+55,2,8,8);c.fillStyle='#91a8c5';c.fillText('Zarar',pad.l+67,10)}bindBars(canvas,rows,labelKey,mode,pad,w)})}
function lineChart(canvas,series){requestAnimationFrame(()=>{let w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;let c=canvas.getContext('2d');c.scale(d,d);let vals=series.flatMap(s=>s.values),mn=Math.min(0,...vals),mx=Math.max(.0001,...vals),p=24;c.strokeStyle='#29415f';c.strokeRect(p,p,w-2*p,h-2*p);series.forEach((s,j)=>{c.strokeStyle=s.color;c.lineWidth=1.7;c.beginPath();s.values.forEach((v,i)=>{let x=p+i*(w-2*p)/Math.max(1,s.values.length-1),y=h-p-(v-mn)/(mx-mn)*(h-2*p);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=s.color;c.fillRect(p+j*90,5,8,8);c.fillStyle='#91a8c5';c.font='10px sans-serif';c.fillText(s.name,p+12+j*90,13)});bindLines(canvas,series,p,w)})}
function filterScatter(canvas,rows){requestAnimationFrame(()=>{let w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;let c=canvas.getContext('2d');c.scale(d,d);let p={l:52,r:16,t:18,b:38},mx=Math.max(1,...rows.map(x=>+x.trades)),ys=rows.map(x=>+x.total_return),lo=Math.min(0,...ys),hi=Math.max(.001,...ys);c.strokeStyle='#29415f';c.strokeRect(p.l,p.t,w-p.l-p.r,h-p.t-p.b);let zy=h-p.b-(0-lo)/(hi-lo)*(h-p.t-p.b);c.beginPath();c.moveTo(p.l,zy);c.lineTo(w-p.r,zy);c.stroke();rows.forEach(x=>{let px=p.l+(+x.trades/mx)*(w-p.l-p.r),py=h-p.b-(+x.total_return-lo)/(hi-lo)*(h-p.t-p.b);c.beginPath();c.arc(px,py,x.filter_id==='baseline'?6:4,0,Math.PI*2);c.fillStyle=x.total_return>=0?'#35d68b':'#ff6577';c.fill();if(x.filter_id==='baseline'){c.fillStyle='#91a8c5';c.font='9px sans-serif';c.fillText('Filtresiz',px+7,py-5)}});c.fillStyle='#91a8c5';c.font='10px sans-serif';c.fillText('Toplam işlem sayısı →',p.l,h-8);c.save();c.translate(11,h-p.b);c.rotate(-Math.PI/2);c.fillText('Net toplam getiri →',0,0);c.restore();bindScatter(canvas,rows,p,w,h,mx,lo,hi)})}
function matrix(rows){let years=[...new Set(rows.map(x=>x.bucket.slice(0,4)))].sort(),months=[...Array(12)].map((_,i)=>String(i+1).padStart(2,'0')),map=Object.fromEntries(rows.map(x=>[x.bucket,(+x.profit||0)+(+x.loss||0)])),mx=Math.max(.001,...Object.values(map).map(Math.abs));return `<div class="scroll"><table><thead><tr><th>Yıl</th>${months.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${years.map(y=>`<tr><td>${y}</td>${months.map(m=>{let v=map[y+'-'+m]||0,a=.12+Math.abs(v)/mx*.72,bg=v>=0?`rgba(53,214,139,${a})`:`rgba(255,101,119,${a})`;return `<td style="background:${bg}" title="${fmt(v)}">${fmt(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function panelChart(title,id,rows,key,mode='money'){return `<div class="panel"><h2>${title}</h2><div class="chart"><canvas id="${id}"></canvas></div></div>`}
function heatmap(rows){let sorted=[...rows].sort((a,b)=>b.total_return-a.total_return),mx=Math.max(.001,...sorted.map(x=>Math.abs(x.total_return)));return `<div class="panel"><h2>10 · Filtreler ve net toplam getiri · Heatmap</h2><div class="heat"><b class="hc hn">Filtre</b><b class="hc hn">Getiri</b><b class="hc hn">Win</b><b class="hc hn">Ort. R</b><b class="hc hn">İşlem</b>${sorted.map(x=>{let a=Math.min(.85,.12+Math.abs(x.total_return)/mx*.65),bg=x.total_return>=0?`rgba(53,214,139,${a})`:`rgba(255,101,119,${a})`;return `<div class="hc" title="${esc(x.filter_name)}">${esc(x.filter_name)}</div><div class="hc" style="background:${bg}">${fmt(x.total_return)}</div><div class="hc">${fmt(x.win_rate)}</div><div class="hc">${(+x.avg_r).toFixed(3)}</div><div class="hc">${n(x.trades)}</div>`}).join('')}</div></div>`}
function renderCol(id,period,title){let el=$(id),s=data.summary.find(x=>x.period===period)||{},dur=data.duration.filter(x=>x.period===period),coins=data.coin.filter(x=>x.period===period).sort((a,b)=>(b.profit+Math.abs(b.loss))-(a.profit+Math.abs(a.loss))).slice(0,40),cal=data.calendar.filter(x=>x.grain===grain[id]&&(period==='all'||String(x.bucket).startsWith('2026'))).sort((a,b)=>String(a.bucket).localeCompare(String(b.bucket))),daily=data.calendar.filter(x=>x.grain==='day'&&(period==='all'||x.bucket.startsWith('2026'))).sort((a,b)=>a.bucket.localeCompare(b.bucket)),monthly=data.calendar.filter(x=>x.grain==='month'&&(period==='all'||x.bucket.startsWith('2026'))),br=data.breakdown.filter(x=>x.period===period),ex=br.filter(x=>x.kind==='exit'),wd=br.filter(x=>x.kind==='weekday').sort((a,b)=>a.bucket.localeCompare(b.bucket));let eq=[],dd=[],peak=0,sum=0;daily.forEach(x=>{sum+=(+x.profit||0)+(+x.loss||0);eq.push(sum);peak=Math.max(peak,sum);dd.push(sum-peak)});let roll=[30,90,365].map((days,j)=>({name:days+' gün',color:['#48b8ff','#ffc857','#c084fc'][j],values:daily.map((x,i)=>daily.slice(Math.max(0,i-days+1),i+1).reduce((a,z)=>a+(+z.profit||0)+(+z.loss||0),0))}));let pf=Math.abs(+s.loss)>0?(+s.profit/Math.abs(+s.loss)):0;el.innerHTML=`<div class="period">${title}</div><div class="cards"><div class="card"><div class="k">Toplam işlem</div><div class="v">${n(s.trades)}</div><div class="sub"><span class="pos">${n(s.wins)} kârlı</span> · <span class="neg">${n(s.losses)} zararlı</span></div></div><div class="card"><div class="k">İşlem başı ortalama net getiri</div><div class="v ${(s.avg_trade||0)>=0?'pos':'neg'}">${fmt(s.avg_trade||0)}</div></div><div class="card"><div class="k">Ortalama işlem süresi</div><div class="v">${hrs(s.avg_hours)}</div></div><div class="card"><div class="k">Toplam net kâr</div><div class="v pos">${fmt(s.profit||0)}</div></div><div class="card"><div class="k">Toplam net zarar</div><div class="v neg">${fmt(s.loss||0)}</div></div><div class="card"><div class="k">Profit factor · maliyetler dahil</div><div class="v ${pf>=1?'pos':'neg'}">${pf.toFixed(2)}</div></div></div><div class="panel"><h2>Dönemsel net kâr ve zarar</h2><div class="tabs">${[['day','Gün'],['week','Hafta'],['month','Ay'],['season','Mevsim']].map(x=>`<button data-col="${id}" data-grain="${x[0]}" class="${grain[id]===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="chart"><canvas id="${id}cal"></canvas></div></div>${panelChart('1 · Kümülatif net özsermaye eğrisi',id+'eq',[], 'bucket')}${panelChart('2 · Drawdown eğrisi',id+'dd',[],'bucket')}${panelChart('4 · Çıkış nedeni dağılımı',id+'exc',ex,'bucket','count')}${panelChart('5 · Çıkış nedenine göre net kâr-zarar',id+'exm',ex,'bucket')}${panelChart('6 · Haftanın gününe göre net performans',id+'wd',wd,'bucket')}<div class="panel"><h2>7 · Ay × yıl net getiri heatmap’i</h2>${matrix(monthly)}</div>${panelChart('8 · Hareketli 30 / 90 / 365 günlük net getiri',id+'roll',[],'bucket')}${panelChart('İşlemde kalış süresi · İşlem sayısı',id+'dc',dur,'bucket','count')}${panelChart('İşlemde kalış süresi · Net kâr ve zarar',id+'dm',dur,'bucket')}${panelChart('Coin bazında net kâr ve zarar · en aktif 40',id+'coin',coins,'symbol')}${period==='all'?heatmap(data.filters)+panelChart('11 · Filtre toplam getiri × toplam işlem sayısı',id+'fs',[], 'bucket')+panelChart('9 · Filtreli / filtresiz net getiri · en iyi 20',id+'fc',[], 'bucket'):''}`;chart($(id+'cal'),cal,'bucket');lineChart($(id+'eq'),[{name:'Net özsermaye',color:'#35d68b',values:eq}]);lineChart($(id+'dd'),[{name:'Drawdown',color:'#ff6577',values:dd}]);chart($(id+'exc'),ex,'bucket','count');chart($(id+'exm'),ex,'bucket');chart($(id+'wd'),wd,'bucket');lineChart($(id+'roll'),roll);chart($(id+'dc'),dur,'bucket','count');chart($(id+'dm'),dur,'bucket');chart($(id+'coin'),coins,'symbol');if(period==='all'){filterScatter($(id+'fs'),data.filters);let ff=[...data.filters].sort((a,b)=>b.total_return-a.total_return).slice(0,19),base=data.filters.find(x=>x.filter_id==='baseline');if(base&&!ff.includes(base))ff.unshift(base);chart($(id+'fc'),ff.map(x=>({bucket:x.filter_name,profit:Math.max(0,x.total_return),loss:Math.min(0,x.total_return)})),'bucket')}}
function render(){renderCol('left','all','Tüm yıllar');renderCol('right','2026','Yalnızca 2026');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{grain[b.dataset.col]=b.dataset.grain;render()})}
async function load(){let sid=$('scenario').value,tf=$('tf').value;data=await fetch(`data/${sid}_${tf}.json`).then(r=>r.json());render()}
fetch('data/scenarios.json').then(r=>r.json()).then(x=>{scenarios=x;let uniq=[...new Map(x.map(s=>[s.scenario_id,s])).values()];$('scenario').innerHTML=uniq.map(s=>`<option value="${s.scenario_id}">${String(s.scenario_id).padStart(3,'0')} · ${esc(s.scenario)}</option>`).join('');function tf(){let sid=+$('scenario').value,vals=x.filter(s=>s.scenario_id===sid).map(s=>s.timeframe);$('tf').innerHTML=vals.map(v=>`<option>${v}</option>`).join('');load()}$('scenario').onchange=tf;$('tf').onchange=load;tf()});
</script></body></html>
