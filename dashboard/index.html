<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backtest Karşılaştırma Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#07070b;--bg1:#0d0c13;--bg2:#14121c;--panel:#15131d;--panel-2:#1b1826;--panel-3:#221e2e;--gold:#d9b45b;--gold-hi:#f4e3a6;--gold-deep:#b98f33;--gold-grad:linear-gradient(135deg,#f4e3a6 0%,#d9b45b 45%,#b98f33 100%);--gold-dim:rgba(217,180,91,.14);--gold-line:rgba(217,180,91,.22);--ink:#f5f2e9;--ink-dim:#c9c4d4;--muted:#9d97ae;--faint:#6f6980;--up:#63d6a0;--down:#e8707e;--info:#8fb6e8;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--shadow-lg:0 22px 60px -18px rgba(0,0,0,.85);--shadow-sm:0 8px 26px -12px rgba(0,0,0,.7);--font-display:'Playfair Display',Georgia,serif;--font-body:'Manrope','Segoe UI',system-ui,sans-serif;--r-lg:22px;--r-md:16px;--r-sm:12px;--pad:18px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg0) 55%);color:var(--ink);font:15.5px/1.55 var(--font-body)}
.top{position:sticky;top:0;z-index:5;padding:15px 22px;background:rgba(7,7,11,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
h1{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0 0 10px;color:var(--ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap}
label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:grid;gap:4px}

.column{min-width:0}

.card,.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card{padding:13px 14px;border-radius:var(--r-sm)}

.panel{padding:16px;margin-top:12px}
.panel h2{font-family:var(--font-display);font-weight:600;font-size:15px;margin:0 0 12px;color:var(--ink-dim)}

.chart{height:230px;width:100%}
.chart svg{width:100%;height:100%;display:block}
.scroll{max-height:380px;overflow:auto}

.hn{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;background:transparent}
.alert{margin:0 0 8px;padding:10px 12px;border:1px solid var(--gold-line);background:var(--gold-dim);color:var(--gold-hi);border-radius:var(--r-sm)}
.note{padding:0 22px 18px;color:var(--muted);font-size:12.5px}
#tip{position:fixed;display:none;z-index:20;pointer-events:none;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold-line);border-radius:var(--r-sm);padding:9px 11px;color:var(--ink);box-shadow:var(--shadow-lg);font-size:12px;max-width:280px}
.btsvg text{font-family:var(--font-body)}
@media(max-width:1000px){.split{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><h1>Binance Futures · Metot Analizi</h1><div class="controls"><label>Metot<select id="scenario"></select></label><label>Zaman dilimi<select id="tf"></select></label></div></header><main class="split"><section class="column" id="left"></section><section class="column" id="right"></section></main><div id="tip"></div><div class="note">Kâr ve zarar, kaldıraçsız işlem getirilerinin toplamıdır. Aynı 5 dakikalık mumda iki seviye görülürse stop önce uygulanır. 2026 paneli mevcut son veri tarihine kadardır.</div>
<script>
const $=x=>document.getElementById(x), fmt=x=>(+x*100).toLocaleString('tr-TR',{maximumFractionDigits:2})+'%', n=x=>(+x||0).toLocaleString('tr-TR'), hrs=x=>(+x||0).toLocaleString('tr-TR',{maximumFractionDigits:1})+' sa';let scenarios=[],data,grain={left:'month',right:'month'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTip(e,html,pin=false){let t=$('tip');t.innerHTML=html;t.style.display='block';t.style.left=Math.min(innerWidth-300,e.clientX+14)+'px';t.style.top=Math.min(innerHeight-130,e.clientY+14)+'px';if(pin)t.dataset.pin='1'}

function bindBars(svg,rows,key,mode,pad,w){let hit=e=>{let {x}=svgXY(svg,e,w,230),idx=Math.floor((x-pad.l)/(w-pad.l-pad.r)*rows.length);if(idx<0||idx>=rows.length)return hideTip();let z=rows[idx],html=`<b>${esc(z[key])}</b><br>${mode==='count'?'İşlem: '+n(z.trades):'Net kâr: '+fmt(z.profit||0)+'<br>Net zarar: '+fmt(z.loss||0)+'<br>İşlem: '+n(z.trades||0)}`;showTip(e,html)};svg.onmousemove=hit;svg.onmouseleave=hideTip;svg.onclick=e=>{hit(e);$('tip').dataset.pin='1'}}

function bindScatter(svg,rows,p,w,h,mx,lo,hi){let hit=e=>{let {x,y}=svgXY(svg,e,w,h),best=null,bd=18;rows.forEach(z=>{let px=p.l+(+z.trades/mx)*(w-p.l-p.r),py=h-p.b-(+z.total_return-lo)/(hi-lo)*(h-p.t-p.b),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=z}});if(!best)return hideTip();showTip(e,`<b>${esc(best.filter_name)}</b><br>Net getiri: ${fmt(best.total_return)}<br>İşlem: ${n(best.trades)}<br>Win rate: ${fmt(best.win_rate)}`)};svg.onmousemove=hit;svg.onmouseleave=hideTip;svg.onclick=e=>{hit(e);$('tip').dataset.pin='1'}}
document.addEventListener('click',e=>{if(!e.target.closest('svg')){let t=$('tip');t.dataset.pin='';t.style.display='none'}});
function chart(container,rows,labelKey,mode='money'){let w=680,h=230;if(!rows.length){container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" class="btsvg"><text x="10" y="20" fill="var(--muted)" font-size="11">Veri yok</text></svg>`;return}let pad={l:42,r:8,t:12,b:42},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(mode==='count'?1:0.000000001,...rows.flatMap(x=>[Math.abs(+x.profit||0),Math.abs(+x.loss||0),+x.trades||0])),bw=Math.max(2,cw/rows.length*.7),zero=mode==='count'?h-pad.b:h-pad.t+ch/2,bars='',labels='';rows.forEach((x,i)=>{let cx=pad.l+(i+.5)*cw/rows.length;if(mode==='count'){let bh=(+x.trades||0)/max*ch;bars+=`<rect data-i="${i}" x="${(cx-bw/2).toFixed(1)}" y="${(zero-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="var(--info)"><title>${esc(x[labelKey])}: ${n(x.trades||0)}</title></rect>`}else{let ph=Math.abs(+x.profit||0)/max*ch/2,lh=Math.abs(+x.loss||0)/max*ch/2;bars+=`<rect data-i="${i}" x="${(cx-bw/2).toFixed(1)}" y="${(zero-ph).toFixed(1)}" width="${bw.toFixed(1)}" height="${ph.toFixed(1)}" rx="2" fill="var(--up)"><title>${esc(x[labelKey])} kâr: ${fmt(x.profit||0)}</title></rect>`;bars+=`<rect data-i="${i}" x="${(cx-bw/2).toFixed(1)}" y="${zero.toFixed(1)}" width="${bw.toFixed(1)}" height="${lh.toFixed(1)}" rx="2" fill="var(--down)"><title>${esc(x[labelKey])} zarar: ${fmt(x.loss||0)}</title></rect>`}if(rows.length<=20||i%Math.ceil(rows.length/12)===0){labels+=`<text x="${cx.toFixed(1)}" y="${h-5}" font-size="9" fill="var(--faint)" text-anchor="end" transform="rotate(-32 ${cx.toFixed(1)} ${h-5})">${esc(String(x[labelKey]).slice(0,13))}</text>`}});let legend=mode==='count'?`<rect x="${pad.l}" y="2" width="8" height="8" rx="2" fill="var(--info)"/><text x="${pad.l+12}" y="10" font-size="10" fill="var(--muted)">İşlem</text>`:`<rect x="${pad.l}" y="2" width="8" height="8" rx="2" fill="var(--up)"/><text x="${pad.l+12}" y="10" font-size="10" fill="var(--muted)">Kâr</text><rect x="${pad.l+55}" y="2" width="8" height="8" rx="2" fill="var(--down)"/><text x="${pad.l+67}" y="10" font-size="10" fill="var(--muted)">Zarar</text>`;container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="btsvg"><line x1="${pad.l}" y1="${zero}" x2="${w-pad.r}" y2="${zero}" stroke="var(--line-2)"/>${bars}${labels}${legend}</svg>`;bindBars(container.querySelector('svg'),rows,labelKey,mode,pad,w)}
function lineChart(container,series){let w=680,h=230,p=24,vals=series.flatMap(s=>s.values),mn=Math.min(0,...vals),mx=Math.max(.0001,...vals),gridlines='',paths='',legend='',ticks=4;for(let i=0;i<=ticks;i++){let v=mn+(mx-mn)*i/ticks,y=h-p-(v-mn)/(mx-mn)*(h-2*p);gridlines+=`<line x1="${p}" y1="${y.toFixed(1)}" x2="${w-p}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="${Math.abs(v)<1e-9?'0':'2,3'}"/><text x="${p-4}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--faint)" text-anchor="end">${fmt(v)}</text>`}series.forEach((s,j)=>{let pts=s.values.map((v,i)=>{let x=p+i*(w-2*p)/Math.max(1,s.values.length-1),y=h-p-(v-mn)/(mx-mn)*(h-2*p);return `${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');paths+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`;legend+=`<rect x="${p+j*95}" y="5" width="8" height="8" rx="2" fill="${s.color}"/><text x="${p+12+j*95}" y="13" font-size="10" fill="var(--muted)">${esc(s.name)}</text>`});container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="btsvg">${gridlines}${paths}${legend}</svg>`;bindLines(container.querySelector('svg'),series,p,w)}
function filterScatter(container,rows){let w=680,h=230,p={l:52,r:16,t:18,b:38},mx=Math.max(1,...rows.map(x=>+x.trades)),ys=rows.map(x=>+x.total_return),lo=Math.min(0,...ys),hi=Math.max(.001,...ys),zy=h-p.b-(0-lo)/(hi-lo)*(h-p.t-p.b),dots='',baseLabel='';rows.forEach(x=>{let px=p.l+(+x.trades/mx)*(w-p.l-p.r),py=h-p.b-(+x.total_return-lo)/(hi-lo)*(h-p.t-p.b),r=x.filter_id==='baseline'?6:4;dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="${x.total_return>=0?'var(--up)':'var(--down)'}"><title>${esc(x.filter_name)}: ${fmt(x.total_return)}</title></circle>`;if(x.filter_id==='baseline')baseLabel=`<text x="${(px+7).toFixed(1)}" y="${(py-5).toFixed(1)}" font-size="9" fill="var(--muted)">Filtresiz</text>`});container.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="btsvg"><rect x="${p.l}" y="${p.t}" width="${w-p.l-p.r}" height="${h-p.t-p.b}" fill="none" stroke="var(--line-2)"/><line x1="${p.l}" y1="${zy.toFixed(1)}" x2="${w-p.r}" y2="${zy.toFixed(1)}" stroke="var(--line)"/>${dots}${baseLabel}<text x="${p.l}" y="${h-8}" font-size="10" fill="var(--muted)">Toplam işlem sayısı →</text><text x="11" y="${h-p.b}" font-size="10" fill="var(--muted)" transform="rotate(-90 11 ${h-p.b})">Net toplam getiri →</text></svg>`;bindScatter(container.querySelector('svg'),rows,p,w,h,mx,lo,hi)}
function matrix(rows){let years=[...new Set(rows.map(x=>x.bucket.slice(0,4)))].sort(),months=[...Array(12)].map((_,i)=>String(i+1).padStart(2,'0')),map=Object.fromEntries(rows.map(x=>[x.bucket,(+x.profit||0)+(+x.loss||0)])),mx=Math.max(.001,...Object.values(map).map(Math.abs)),padL=46,cw=54,ch=24,headH=20,w=padL+months.length*cw,h=headH+years.length*ch,headers=months.map((m,j)=>`<text x="${(padL+j*cw+cw/2).toFixed(1)}" y="14" font-size="10" fill="var(--faint)" text-anchor="middle">${m}</text>`).join(''),cells='';years.forEach((y,i)=>{let ry=headH+i*ch;if(i%2===1)cells+=`<rect x="0" y="${ry}" width="${w}" height="${ch}" fill="rgba(255,255,255,.018)"/>`;cells+=`<text x="${padL-8}" y="${(ry+ch*0.65).toFixed(1)}" font-size="10" fill="var(--ink-dim)" text-anchor="end">${y}</text>`;months.forEach((m,j)=>{let v=map[y+'-'+m]||0,color=heatColor(v,mx),cx=padL+j*cw,cy=ry;cells+=`<rect x="${cx+1}" y="${cy+1}" width="${cw-2}" height="${ch-2}" rx="3" fill="${color}"><title>${y}-${m}: ${fmt(v)}</title></rect><text x="${(cx+cw/2).toFixed(1)}" y="${(cy+ch*0.65).toFixed(1)}" font-size="9" fill="var(--ink-dim)" text-anchor="middle">${v?fmt(v):''}</text>`})});return `<div class="scroll"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="btsvg">${headers}${cells}</svg></div>`}
function panelChart(title,id,rows,key,mode='money'){return `<div class="panel"><h2>${title}</h2><div class="chart" id="${id}"></div></div>`}
function heatmap(rows){let sorted=[...rows].sort((a,b)=>b.total_return-a.total_return),mx=Math.max(.001,...sorted.map(x=>Math.abs(x.total_return)));return `<div class="panel"><h2>10 · Filtreler ve net toplam getiri · Heatmap</h2><div class="heat"><b class="hc hn">Filtre</b><b class="hc hn">Getiri</b><b class="hc hn">Win</b><b class="hc hn">Ort. R</b><b class="hc hn">İşlem</b>${sorted.map(x=>{let bg=heatColor(x.total_return,mx);return `<div class="hc" title="${esc(x.filter_name)}">${esc(x.filter_name)}</div><div class="hc" style="background:${bg}">${fmt(x.total_return)}</div><div class="hc">${fmt(x.win_rate)}</div><div class="hc">${(+x.avg_r).toFixed(3)}</div><div class="hc">${n(x.trades)}</div>`}).join('')}</div></div>`}
function renderCol(id,period,title){let el=$(id),s=data.summary.find(x=>x.period===period)||{},dur=data.duration.filter(x=>x.period===period),coins=data.coin.filter(x=>x.period===period).sort((a,b)=>(b.profit+Math.abs(b.loss))-(a.profit+Math.abs(a.loss))).slice(0,40),cal=data.calendar.filter(x=>x.grain===grain[id]&&(period==='all'||String(x.bucket).startsWith('2026'))).sort((a,b)=>String(a.bucket).localeCompare(String(b.bucket))),daily=data.calendar.filter(x=>x.grain==='day'&&(period==='all'||x.bucket.startsWith('2026'))).sort((a,b)=>a.bucket.localeCompare(b.bucket)),monthly=data.calendar.filter(x=>x.grain==='month'&&(period==='all'||x.bucket.startsWith('2026'))),br=data.breakdown.filter(x=>x.period===period),ex=br.filter(x=>x.kind==='exit'),wd=br.filter(x=>x.kind==='weekday').sort((a,b)=>a.bucket.localeCompare(b.bucket));let eq=[],dd=[],equity=1,peak=1;daily.forEach(x=>{let r=(+x.profit||0)+(+x.loss||0);equity*=Math.max(.000001,1+r);eq.push(equity-1);peak=Math.max(peak,equity);dd.push(equity/peak-1)});let portfolioReturn=eq.length?eq[eq.length-1]:0,maxDrawdown=dd.length?Math.min(...dd):0;let roll=[30,90,365].map((days,j)=>({name:days+' gün',color:['#8fb6e8','#d9b45b','#b48ce8'][j],values:daily.map((x,i)=>daily.slice(Math.max(0,i-days+1),i+1).reduce((a,z)=>a+(+z.profit||0)+(+z.loss||0),0))}));let pf=Math.abs(+s.loss)>0?(+s.profit/Math.abs(+s.loss)):0;el.innerHTML=`<div class="period">${title}</div>${data.timeframe==='1h'?'<div class="alert">1h sonuçlarında pozitif metot bulunmadı; bu zaman dilimini araştırma amaçlı değerlendirin.</div>':''}${!s.trades?'<div class="alert">Bu metot ve dönem için işlem yok. Yüzde sıfır, performans sonucu olarak yorumlanmamalı.</div>':''}<div class="cards"><div class="card"><div class="k">Toplam işlem</div><div class="v">${n(s.trades)}</div><div class="sub"><span class="pos">${n(s.wins)} kârlı</span> · <span class="neg">${n(s.losses)} zararlı</span></div></div><div class="card"><div class="k">İşlem başı ortalama net getiri</div><div class="v ${(s.avg_trade||0)>=0?'pos':'neg'}">${fmt(s.avg_trade||0)}</div></div><div class="card"><div class="k">Ortalama işlem süresi</div><div class="v">${hrs(s.avg_hours)}</div></div><div class="card"><div class="k">Toplam net kâr</div><div class="v pos">${fmt(s.profit||0)}</div></div><div class="card"><div class="k">Toplam net zarar</div><div class="v neg">${fmt(s.loss||0)}</div></div><div class="card"><div class="k">Portföy net getirisi · risk sınırlandırılmış</div><div class="v ${portfolioReturn>=0?'pos':'neg'}">${s.trades?fmt(portfolioReturn):'—'}</div></div><div class="card"><div class="k">Maksimum drawdown</div><div class="v neg">${s.trades?fmt(maxDrawdown):'—'}</div></div><div class="card"><div class="k">Profit factor · maliyetler dahil</div><div class="v ${pf>=1?'pos':'neg'}">${pf.toFixed(2)}</div></div></div><div class="panel"><h2>Dönemsel portföy kâr ve zararı</h2><div class="tabs">${[['day','Gün'],['week','Hafta'],['month','Ay'],['season','Mevsim']].map(x=>`<button data-col="${id}" data-grain="${x[0]}" class="${grain[id]===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="chart" id="${id}cal"></div></div>${panelChart('1 · Risk sınırlı portföy özsermaye eğrisi',id+'eq',[],'bucket')}${panelChart('2 · Portföy drawdown eğrisi',id+'dd',[],'bucket')}${panelChart('4 · Çıkış nedeni dağılımı',id+'exc',ex,'bucket','count')}${panelChart('5 · Çıkış nedenine göre net kâr-zarar',id+'exm',ex,'bucket')}${panelChart('6 · Haftanın gününe göre net performans',id+'wd',wd,'bucket')}<div class="panel"><h2>7 · Ay × yıl net getiri heatmap’i</h2>${matrix(monthly)}</div>${panelChart('8 · Hareketli 30 / 90 / 365 günlük net getiri',id+'roll',[],'bucket')}${panelChart('İşlemde kalış süresi · İşlem sayısı',id+'dc',dur,'bucket','count')}${panelChart('İşlemde kalış süresi · Net kâr ve zarar',id+'dm',dur,'bucket')}${panelChart('Coin bazında net kâr ve zarar · en aktif 40',id+'coin',coins,'symbol')}${period==='all'?heatmap(data.filters)+panelChart('11 · Filtre toplam getiri × toplam işlem sayısı',id+'fs',[],'bucket')+panelChart('9 · Filtreli / filtresiz net getiri · en iyi 20',id+'fc',[],'bucket'):''}`;chart($(id+'cal'),cal,'bucket');lineChart($(id+'eq'),[{name:'Risk sınırlı özsermaye',color:'#63d6a0',values:eq}]);lineChart($(id+'dd'),[{name:'Drawdown',color:'#e8707e',values:dd}]);chart($(id+'exc'),ex,'bucket','count');chart($(id+'exm'),ex,'bucket');chart($(id+'wd'),wd,'bucket');lineChart($(id+'roll'),roll);chart($(id+'dc'),dur,'bucket','count');chart($(id+'dm'),dur,'bucket');chart($(id+'coin'),coins,'symbol');if(period==='all'){filterScatter($(id+'fs'),data.filters);let ff=[...data.filters].sort((a,b)=>b.total_return-a.total_return).slice(0,19),base=data.filters.find(x=>x.filter_id==='baseline');if(base&&!ff.includes(base))ff.unshift(base);chart($(id+'fc'),ff.map(x=>({bucket:x.filter_name,profit:Math.max(0,x.total_return),loss:Math.min(0,x.total_return)})),'bucket')}}
function render(){renderCol('left','all','Tüm yıllar');renderCol('right','2026','Yalnızca 2026');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{grain[b.dataset.col]=b.dataset.grain;render()})}
async function load(){let sid=$('scenario').value,tf=$('tf').value;data=await fetch(`data/${sid}_${tf}.json`).then(r=>r.json());data.timeframe=tf;render()}
fetch('data/scenarios.json').then(r=>r.json()).then(x=>{scenarios=x;let uniq=[...new Map(x.map(s=>[s.scenario_id,s])).values()];$('scenario').innerHTML=uniq.map(s=>`<option value="${s.scenario_id}">${String(s.scenario_id).padStart(3,'0')} · ${esc(s.scenario)}</option>`).join('');function tf(){let sid=+$('scenario').value,vals=x.filter(s=>s.scenario_id===sid).map(s=>s.timeframe);$('tf').innerHTML=vals.map(v=>`<option>${v}</option>`).join('');load()}$('scenario').onchange=tf;$('tf').onchange=load;tf()});
</script></body></html>
